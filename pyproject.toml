[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-hookkit"
version = "0.1.0"
description = "A lightweight, extensible hook framework for preloaded large language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
torch = ["torch>=2.0"]
transformers = ["transformers>=4.0", "torch>=2.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
llm-hookkit = "llm_hookkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
